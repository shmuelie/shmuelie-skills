name: Library CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE_PROJECT: ${{ vars.PACKAGE_PROJECT }}
      TEST_PROJECT: ${{ vars.TEST_PROJECT }}
      CONSUMER_PROJECT: ${{ vars.CONSUMER_PROJECT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.401
      - name: Test, pack, and consume the local package
        shell: bash
        run: |
          set -euo pipefail
          export NUGET_PACKAGES="$RUNNER_TEMP/library-ci-packages"
          : "${PACKAGE_PROJECT:?Configure PACKAGE_PROJECT}"
          : "${TEST_PROJECT:?Configure TEST_PROJECT}"
          : "${CONSUMER_PROJECT:?Configure CONSUMER_PROJECT}"
          dotnet test "$TEST_PROJECT" --configuration Release
          dotnet pack "$PACKAGE_PROJECT" --configuration Release --output artifacts -p:ContinuousIntegrationBuild=true
          dotnet restore "$CONSUMER_PROJECT" --source "$GITHUB_WORKSPACE/artifacts" --packages "$RUNNER_TEMP/consumer-only"
          dotnet run --project "$CONSUMER_PROJECT" --configuration Release --no-restore
      - name: Inspect required package content
        shell: pwsh
        run: ./eng/package/Test-LibraryPackage.ps1 -ArtifactDirectory ./artifacts -PolicyPath ./package-policy.json -Commit $env:GITHUB_SHA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: error
