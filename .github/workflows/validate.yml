name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate manifests and skills
        shell: pwsh
        run: ./scripts/Test-Marketplace.ps1

  nuget-fixture:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.401
      - name: Release decision tests (offline)
        shell: pwsh
        run: ./.github/plugin/shmuelie-nuget/skills/nuget-release/examples/Test-Release.ps1 -ScratchRoot $env:RUNNER_TEMP
      - name: Canonical package fixture (never publishes)
        shell: pwsh
        run: ./.github/plugin/shmuelie-nuget/skills/dotnet-library-projects/examples/Test-Fixture.ps1 -ScratchRoot $env:RUNNER_TEMP
